<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Left ring -->
  <circle cx="35" cy="50" r="22" fill="none" stroke="#c9a96e" stroke-width="9"/>
  <!-- Right ring (overlapping) -->
  <circle cx="65" cy="50" r="22" fill="none" stroke="#c9a96e" stroke-width="9"/>
  <!-- Cover left arc overlap so rings interlock visually -->
  <path d="M 65,28 A 22,22 0 0 1 65,72" fill="none" stroke="#ffffff" stroke-width="10"/>
  <path d="M 65,29.5 A 22,22 0 0 1 65,70.5" fill="none" stroke="#c9a96e" stroke-width="9"/>
</svg>
